<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Temperature Dashboard Extraction Device</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@1.4.0"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #333;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
    }

    canvas {
      max-width: 100%;
      height: 600px;
    }

    .info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      padding: 10px;
      font-size: 18px;
      text-align: left;
    }

    button {
      background-color: #28a745;
      color: white;
      padding: 10px;
      border: none;
      cursor: pointer;
      font-size: 16px;
      margin: 5px;
    }

    button:disabled {
      background-color: #ccc;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Temperature Dashboard Extraction Device</h1>
    <div style="margin-bottom: 20px;">
      <label>Target (°C): <input type="number" id="line1" value="56"></label>
      <button onclick="updateLines()">Update Lines</button>
    </div>

    <div>
      <canvas id="temperatureChart"></canvas>
    </div>

    <div class="info">
      <span>Elapsed Time: <b id="elapsed_time">0</b> sec</span>
      <span>Temp1: <b id="temp1">0</b> °C</span>
      <span>Temp2: <b id="temp2">0</b> °C</span>
    </div>

    <button onclick="startExperiment()">Start Experiment</button>
    <button onclick="stopExperiment()">Stop Experiment</button>
    <button onclick="downloadCSV()">Download CSV</button>
  </div>

  <script>
    var socket = io.connect("http://" + document.domain + ":" + location.port);
    var csvData = [];
    var temp1 = [];
    var temp2 = [];
    var labels = [];

    var ctx = document.getElementById('temperatureChart').getContext('2d');
    var temperatureChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [
          {
            label: 'Temp1 (°C)',
            data: temp1,
            borderColor: 'red',
            fill: false
          },
          {
            label: 'Temp2 (°C)',
            data: temp2,
            borderColor: 'blue',
            fill: false
          }
        ]
      },
      options: {
        responsive: true,
        plugins: {
          annotation: {
            annotations: {
              targetLine: {
                type: 'line',
                yMin: 56,
                yMax: 56,
                borderColor: 'rgba(255, 0, 0, 0.5)',
                borderWidth: 2,
                borderDash: [6, 6],
                label: {
                  content: '56°C',
                  enabled: true,
                  position: 'start',
                  color: 'red',
                  backgroundColor: 'white'
                }
              }
            }
          }
        },
        scales: {
          x: {
            title: {
              display: true,
              text: 'Elapsed Time (seconds)'
            }
          },
          y: {
            title: {
              display: true,
              text: 'Temperature (°C)'
            }
          }
        }
      }
    });

    socket.on('update', function (data) {
      csvData.push([data.elapsed_time, data.temp1, data.temp2]);

      if (labels.length >= 28800) { // 8 hours at 1 sec interval
        labels.shift();
        temp1.shift();
        temp2.shift();
      }

      labels.push(data.elapsed_time);
      temp1.push(data.temp1);
      temp2.push(data.temp2);
      temperatureChart.update();

      document.getElementById('elapsed_time').innerText = data.elapsed_time;
      document.getElementById('temp1').innerText = data.temp1;
      document.getElementById('temp2').innerText = data.temp2;
    });

    function startExperiment() {
      fetch('/start', { method: 'POST' });
    }

    function stopExperiment() {
      fetch('/stop', { method: 'POST' });
    }

    function downloadCSV() {
      let csvContent = "data:text/csv;charset=utf-8,Elapsed Time (s),Temp 1 (°C),Temp 2 (°C)\n";
      csvData.forEach(row => {
        csvContent += row.join(",") + "\n";
      });

      let encodedUri = encodeURI(csvContent);
      let link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", "2_sensor_extraction_device.csv");
      document.body.appendChild(link);
      link.click();
    }

    function updateLines() {
      const lineValue = parseFloat(document.getElementById("line1").value);

      // Update annotation line dynamically
      temperatureChart.options.plugins.annotation.annotations.targetLine.yMin = lineValue;
      temperatureChart.options.plugins.annotation.annotations.targetLine.yMax = lineValue;
      temperatureChart.options.plugins.annotation.annotations.targetLine.label.content = `${lineValue}°C`;

      temperatureChart.update();
    }
  </script>
</body>
</html>
